<p-toast></p-toast>
<div class="card" style="height: 30px;">
    <h4 style="margin-top: -10px;">Ingreso de Facturas</h4>
</div>

<div class="grid">
    <div class="col-12 xl:col-6">
        <div class="card">
            <h5>Clientes</h5>
            <p-table [value]="clientes" [lazy]="true" (onLazyLoad)="onLazyLoad($event)" [totalRecords]="totalRecords"
                [rows]="5" [rowHover]="true" styleClass="p-datatable-gridlines" [paginator]="true"
                
                (onRowSelect)="onRowClienteSeleccionado($event)" rowSelectable="true">>
                <ng-template pTemplate="caption">
                    <div class="flex justify-content-between flex-column sm:flex-row">
                        <span class="p-input-icon-left mb-2">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" placeholder="Código del Cliente" class="w-full"
                                (input)="onIdInput($event)"  [(ngModel)]="searchTerm" />
                        </span>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th>Código</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Nº de Céduda</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-cliente>
                    <tr (click)="onRowClienteSeleccionado({data: cliente})" class="table-row-hover">
                        <td>{{cliente.id}}</td>
                        <td>{{cliente.nombres}}</td>
                        <td>{{cliente.apellidos}}</td>
                        <td>{{cliente.cedula}}</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="4">No existen registros</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="loadingbody">
                    <tr>
                        <td colspan="4">Loading users data. Please wait.</td>
                    </tr>
                </ng-template>
            </p-table>
            <div *ngIf="loading" class="table-loading-overlay">
                <div class="loading-box">
                    <p-progressSpinner styleClass="spinner-overlay"></p-progressSpinner>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 xl:col-6">
        <div class="card">
            <h5>Ingreso de datos</h5>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <div class="grid p-fluid mt-3">
                    <div class="field col-12 md:col-6">
                        <div class="p-inputgroup">
                            <span class="p-inputgroup-addon">
                                <i class="pi pi-id-card"></i>
                            </span>
                            <span class="p-float-label">
                                <input type="text" pInputText formControlName="codigo" />
                                <label for="codigo">Código</label>
                            </span>
                        </div>
                    </div>
                    <div class="field col-12 md:col-6">
                        <div class="p-inputgroup">
                            <span class="p-inputgroup-addon">
                                <i class="pi pi-id-card"></i>
                            </span>
                            <span class="p-float-label">
                                <input type="text" pInputText formControlName="cedula" />
                                <label for="cedula">Nº de Identidad</label>
                            </span>
                        </div>
                    </div>
                    <div class="field col-12 md:col-6">
                        <div class="p-inputgroup">
                            <span class="p-inputgroup-addon">
                                <i class="pi pi-user"></i>
                            </span>
                            <span class="p-float-label">
                                <input type="text" pInputText formControlName="nombres" />
                                <label for="nombres">Nombres</label>
                            </span>
                        </div>
                    </div>
                    <div class="field col-12 md:col-6">
                        <div class="p-inputgroup">
                            <span class="p-inputgroup-addon">
                                <i class="pi pi-user"></i>
                            </span>
                            <span class="p-float-label">
                                <input type="text" pInputText formControlName="apellidos" />
                                <label for="apellidos">Apellidos</label>
                            </span>
                        </div>
                    </div>
                    <div class="field col-12 md:col-6">
                        <div class="p-inputgroup">
                            <span class="p-inputgroup-addon">
                                <i class="pi pi-calendar"></i>
                            </span>
                            <span class="p-float-label">
                                <p-calendar id="fecha" formControlName="fecha" [showIcon]="true" dateFormat="dd/mm/yy">
                                </p-calendar>
                                <label for="fecha">Fecha del pago</label>
                            </span>
                        </div>
                    </div>
                    <div class="field col-12 md:col-6">
                        <div class="p-inputgroup">
                            <span class="p-inputgroup-addon">
                                <i class="pi pi-chart-line"></i>
                            </span>
                            <span class="p-float-label">
                                <input type="text" pInputText formControlName="libras" />
                                <label for="libras">Cantidad en Libras</label>
                            </span>
                        </div>
                        <div *ngIf="registerForm.get('libras')?.invalid && (registerForm.get('libras')?.dirty || registerForm.get('libras')?.touched)"
                            class="p-error">
                            <small *ngIf="registerForm.get('libras')?.errors?.['pattern']">Solo se permiten números y un
                                punto decimal.</small>
                        </div>
                    </div>

                </div>
                <div class="flex justify-content-center mt-3">
                    <button pButton type="button" label="Limpiar" class="p-button-secondary mr-2"
                        (click)="onClear()"></button>
                    <button pButton type="submit" label="Registrar"></button>
                </div>
            </form>
        </div>
    </div>
</div>
