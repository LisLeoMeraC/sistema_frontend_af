<p-toast></p-toast>
<div class="card" style="height: 30px;">
    <h4 style="margin-top: -10px;">Compras de Cacao</h4>
</div>
<div class="card">
    <p-table [value]="comprasSemanales" [rowHover]="true" scrollDirection="both" [scrollable]="true"
        scrollHeight="400px" styleClass="mt-3" responsiveLayout="scroll">
        <ng-template pTemplate="caption">
            <form [formGroup]="searchForm">
            <div class="grid p-fluid">
                <!-- Primera columna: Fecha Inicio -->
                <div class="col-12 md:col-3">
                    <div class="p-inputgroup">
                        <span class="p-inputgroup-addon">
                            <i class="pi pi-calendar"></i>
                        </span>
                        <span class="p-float-label">
                            <p-calendar id="fechaInicio" formControlName="fechaInicio" [showIcon]="true"
                                        dateFormat="dd/mm/yy" [appendTo]="'body'">
                            </p-calendar>
                            <label for="fechaInicio">Fecha Inicio</label>
                        </span>
                    </div>
                </div>

                <!-- Segunda columna: Fecha Fin -->
                <div class="col-12 md:col-3">
                    <div class="p-inputgroup">
                        <span class="p-inputgroup-addon">
                            <i class="pi pi-calendar"></i>
                        </span>
                        <span class="p-float-label">
                            <p-calendar id="fechaFin" formControlName="fechaFin" [showIcon]="true"
                                        dateFormat="dd/mm/yy" [appendTo]="'body'">
                            </p-calendar>
                            <label for="fechaFin">Fecha Fin</label>
                        </span>
                    </div>
                </div>

                <div class="col-12 md:col-3" style="text-align: center;">
                    <p-selectButton [options]="tipoCacao" optionLabel="name" formControlName="tipoCacao" class="full-width"></p-selectButton>
                </div>

                <!-- Tercera columna: Botones -->
                <div class="col-12 md:col-3">
                    <div class="p-inputgroup">
                        <button pButton type="button" label="Buscar" icon="pi pi-search" class="mr-2" (click)="cargarComprasSemanalesporFecha()"></button>
                        <button pButton type="button" label="Limpiar" icon="pi pi-trash" class="p-button-warning" (click)="limpiarFechas()"></button>
                    </div>
                </div>
            </div>
        </form>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th style="text-align: center;">Fecha</th>
                <th style="text-align: center;">Categoría de Cacao</th>
                <th style="text-align: center;">Cantidad en Libras</th>
                <th style="text-align: center;">Dinero Total</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-semanal>
            <tr>
                <td style="text-align: center;">{{ semanal.fecha | date: 'yyyy-MM-dd' }}</td>
                <td style="text-align: center;">{{semanal.tipoCacao}}</td>
                <td style="text-align: center;">{{semanal.sumaCantidadLibra}}</td>
                <td style="text-align: center;">{{semanal.sumaValorMasDos | currency:'USD':'code'}}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4">No existen registros</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="loadingbody">
            <tr>
                <td colspan="4">Loading users data. Please wait.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<div class="grid p-fluid justify-content-end">
    <!-- Primera columna -->
    <div class="col-12 md:col-3">
        <div class="p-inputgroup mt-2">
            <span class="p-inputgroup-addon">
                <i class="pi pi-plus"></i>
            </span>
            <span class="p-float-label">
                <input type="text" pInputText [value]="totalQuintales | number:'1.2-2'" disabled  class="red-text"/>
                <label for="totalQuintales">Total Quintales</label>
            </span>
        </div>
    </div>

    <!-- Segunda columna -->
    <div class="col-12 md:col-3">
        <div class="p-inputgroup mt-2">
            <span class="p-inputgroup-addon">
                <i class="pi pi-plus"></i>
            </span>
            <span class="p-float-label">
                <input type="text" pInputText [value]="dineroTotal | currency:'USD':'code'" disabled class="red-text" />
                <label for="dineroTotal">Dinero Total</label>
            </span>
        </div>
    </div>

    <!-- Tercera columna -->
    <div class="col-12 md:col-3">
        <div class="p-inputgroup mt-2">
            <span class="p-inputgroup-addon">
                <i class="pi pi-percentage"></i>
            </span>
            <span class="p-float-label">
                <input type="text" pInputText [value]="promedio | currency:'USD':'code'" disabled class="red-text"/>
                <label for="promedio">Promedio Precio</label>
            </span>
        </div>
    </div>
</div>
